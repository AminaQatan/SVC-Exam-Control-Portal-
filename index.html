<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVC Exam Portal</title>
<meta name="description" content="Exam invigilation portal for Salalah Vocational College. Developer: Ms. Amina Qatan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style id="appcss">
/* Layout: Oracle APEX-style app shell. Brand top bar, room navigator on the left (a drawer on phones), working area with section tabs. */
:root{
  --bg:#EDF1F2;
  --surface:#FFFFFF;
  --surface-2:#F4F7F8;
  --line:#D6DEE1;
  --fg:#152025;
  --muted:#55656C;
  --ok:#1F7F49;
  --amber:#9A600A;
  --st-none:#B7C2C6;
  --ok-soft:color-mix(in oklab, var(--ok) 13%, var(--surface));
  --amber-soft:color-mix(in oklab, var(--amber) 14%, var(--surface));
  /* accent tokens, rewritten by the colour picker */
  --brand:#3E7C87; --brand-ink:#FFFFFF;
  --brand-text-l:#2F646D; --brand-text-d:#93C6CF;
  --brand-text:var(--brand-text-l);
  --brand-soft:color-mix(in oklab, var(--brand) 11%, var(--surface));
  --band:#19D3E0; --band-ink:#111A1D;
  --w1:#F2A43A; --w1-ink:#111A1D;
  --w2:#8AB4F0; --w2-ink:#111A1D;
  --w3:#E53935; --w3-ink:#111A1D;
  --w4:#E9B824; --w4-ink:#111A1D;
  --notice:#16BFD1; --notice-ink:#111A1D;
  --absent:#F4D514; --absent-ink:#111A1D;
  --shadow:0 1px 2px rgb(14 30 36 / .05), 0 8px 24px rgb(14 30 36 / .06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --top:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0C1114; --surface:#141B1F; --surface-2:#1A2328; --line:#28343A; --fg:#E2E9EC; --muted:#93A3AA;
    --ok:#5BC487; --amber:#E5A84E; --st-none:#3D4B51;
    --brand-text:var(--brand-text-d);
    --brand-soft:color-mix(in oklab, var(--brand) 24%, var(--surface));
    --shadow:0 1px 2px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --bg:#0C1114; --surface:#141B1F; --surface-2:#1A2328; --line:#28343A; --fg:#E2E9EC; --muted:#93A3AA;
  --ok:#5BC487; --amber:#E5A84E; --st-none:#3D4B51;
  --brand-text:var(--brand-text-d);
  --brand-soft:color-mix(in oklab, var(--brand) 24%, var(--surface));
  --shadow:0 1px 2px rgb(0 0 0 / .35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--top);display:flex;align-items:center;gap:10px;background:var(--brand);color:var(--brand-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:var(--r-sm);background:transparent;color:inherit;flex:none}
.iconbtn:hover{background:color-mix(in oklab, currentColor 14%, transparent)}
.iconbtn .ic{width:22px;height:22px}
/* college logo in a circular frame; the white ground is the logo's own, kept in both themes */
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 2px color-mix(in oklab, var(--brand-ink) 45%, transparent), 0 2px 6px rgb(0 0 0 / .18);overflow:hidden;flex:none}
.logo img{width:80%;height:80%;object-fit:contain;display:block}
.appname{min-width:0;display:flex;flex-direction:column}
.appname b{font:600 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appname span{font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.topbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in oklab, currentColor 38%, transparent);background:color-mix(in oklab, currentColor 10%, transparent);color:inherit;font-weight:500;flex:none}
.topbtn:hover{background:color-mix(in oklab, currentColor 18%, transparent)}
.topbtn[aria-current="page"]{background:var(--brand-ink);color:var(--brand);border-color:transparent}
@media (max-width:600px){.appname span{display:none}.topbtn .lbl{display:none}.topbtn{padding:0;width:40px;justify-content:center}}
@media (max-width:380px){.logo{width:40px;height:40px}.topbar{gap:8px}}
@media (min-width:960px){#menuBtn{display:none}}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.shell{grid-template-columns:252px minmax(0,1fr)}}
.sidenav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 10px 24px}
@media (min-width:960px){.sidenav{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow-y:auto}}
@media (max-width:959.98px){
  .sidenav{position:fixed;z-index:70;top:0;bottom:0;left:0;width:min(300px,86vw);overflow-y:auto;transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  body.nav-open .sidenav{transform:none}
}
.scrim{position:fixed;inset:0;z-index:65;background:rgb(6 12 14 / .45)}
.whoami{display:flex;flex-direction:column;gap:6px;padding:10px;margin:0 2px 4px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.whoami label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.whoami select{height:38px;background:var(--surface)}
.whoami p{font-size:11.5px;color:var(--muted);line-height:1.4}
.nav-top{padding:4px 4px}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nav-group h2{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:8px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border:0;border-radius:var(--r-sm);background:transparent;text-align:left;color:var(--fg)}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.tag{margin-left:auto;font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:999px;border:1px solid currentColor;opacity:.8}
.dot{width:9px;height:9px;border-radius:50%;background:transparent;border:1.5px solid var(--muted);flex:none;display:inline-block}
.dot.progress{background:var(--amber);border-color:var(--amber)}
.dot.complete{background:var(--ok);border-color:var(--ok)}
.nav-item .count{margin-left:auto;font:500 11px/1 var(--f-data);padding:4px 7px;border-radius:999px;background:var(--w3);color:var(--w3-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:14px 10px 0;margin-top:auto;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* main */
main{min-width:0;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:960px){main{padding-block:28px 40px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--brand-text);font-weight:500}
.band{border-radius:var(--r);background:var(--band);color:var(--band-ink);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.band b{font:700 13px/1.4 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.band > span{font-size:13.5px}
.bandgrid{display:grid;gap:10px 12px;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:980px){.bandgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bf.wide{grid-column:1 / -1}}
.bf{display:flex;flex-direction:column;gap:4px;min-width:0}
.bf > label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.82}
.band .input{height:auto;min-height:40px;background:var(--surface);color:var(--fg);border-color:transparent;font-weight:500}
.ms{position:relative}
.ms-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding-block:8px;line-height:1.35;cursor:pointer}
.ms-btn .ic{width:16px;height:16px;color:var(--muted)}
.ms-pop{position:absolute;z-index:20;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.ms-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-weight:500;font-size:14px}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt input{accent-color:var(--brand);width:16px;height:16px;margin:0}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-text);display:inline-flex;align-items:center;gap:6px}
.pagehead h1{font-size:clamp(26px,4vw,34px);font-weight:600}
.lead{color:var(--muted);font-size:14.5px;max-width:65ch}
.roomhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.roomhead h1{font-size:clamp(28px,4.4vw,36px);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.progress{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.complete{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.roomhead .seg{margin-left:auto}
.seg button{border:0;background:none;height:34px;padding:0 16px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg.sm button{height:30px;padding:0 12px;font-size:13px}
@media (max-width:560px){.roomhead .seg{margin-left:0;width:100%}.roomhead .seg button{flex:1}}

/* stat tiles */
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.stats,.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 26px/1.15 var(--f-body)}
.stat .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.lv{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-data);font-size:11.5px}
.lv i{width:9px;height:9px;border-radius:2px;background:var(--lv)}

/* tabs */
.tabs-wrap{overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs{display:flex;gap:2px;min-width:max-content}
.tab{border:0;background:none;padding:10px 14px 9px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font:500 11px/1 var(--f-data);background:var(--surface-2);border:1px solid var(--line);color:var(--muted);padding:3px 6px;border-radius:999px}

/* panels and forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
@media (min-width:760px){.panel{padding:22px 24px}}
.panel-h{display:flex;flex-direction:column;gap:4px}
.panel-h h2{font-size:19px;font-weight:600}
.form{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.input{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);width:100%;min-width:0}
textarea.input{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab, var(--brand) 25%, transparent)}
.input[readonly]{color:var(--muted);background:transparent;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--brand);color:var(--brand-ink);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;font-weight:500}
.addrow{display:grid;gap:10px 12px;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) auto;align-items:end}
.addrow.two{grid-template-columns:minmax(0,1fr) auto}
@media (max-width:640px){.addrow,.addrow.two{grid-template-columns:minmax(0,1fr)}}
.empty{color:var(--muted);font-size:13.5px}

/* warning board */
.board{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.board{grid-template-columns:minmax(0,1fr)}}
.l1{--lv:var(--w1);--lv-ink:var(--w1-ink)}
.l2{--lv:var(--w2);--lv-ink:var(--w2-ink)}
.l3{--lv:var(--w3);--lv-ink:var(--w3-ink)}
.l4{--lv:var(--w4);--lv-ink:var(--w4-ink)}
.lane{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.lane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--lv);color:var(--lv-ink);font:600 14px/1.2 var(--f-display)}
.lane-h .num{font-size:12.5px}
.lane-b{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:76px}
.lane-b .empty{padding:6px 2px}
.inc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.inc .name{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.inc .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* absentees */
.strip{border-radius:var(--r-sm);background:var(--absent);color:var(--absent-ink);padding:10px 14px;font:600 15px/1.3 var(--f-display);display:flex;justify-content:space-between;gap:12px}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.list li:first-child{border-top:0}
.list .idx{font:500 12px/1 var(--f-data);color:var(--muted);width:22px;flex:none}
.list .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}

/* comments */
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);cursor:pointer;user-select:none}
.flag:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text);font-weight:600}
.flag input{accent-color:var(--brand);width:16px;height:16px;margin:0}
.flag .ar{font-size:12.5px;color:var(--muted);font-weight:400}

/* notice */
.notice{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.notice .ar{background:var(--notice);color:var(--notice-ink);padding:18px 16px;font:600 clamp(18px,2.6vw,23px)/1.7 var(--f-body);text-align:center}
.notice .en{background:var(--surface-2);padding:14px 16px;font-weight:600;text-align:center}

/* tables */
.sectionhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.sectionhead h2{font-size:19px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
th.r,td.r{text-align:right}
td.num{font-size:13.5px}
.linkbtn{border:0;background:none;padding:0;font-weight:600;color:var(--brand-text);text-align:left}
.linkbtn:hover{text-decoration:underline}
.type{font-size:12px;color:var(--muted)}

/* end-of-day report */
.adminbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text)}
.dlbar{display:flex;flex-wrap:wrap;gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.filter{display:flex;flex-direction:column;gap:6px}
.filter > span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.examplenote{background:color-mix(in oklab, var(--absent) 20%, var(--surface));border:1px solid color-mix(in oklab, var(--absent) 60%, var(--line));border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;max-width:none}
.charts{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chart.wide{grid-column:1 / -1}
.chart figcaption{display:flex;flex-direction:column;gap:2px}
.chart figcaption h3{font-size:15.5px;font-weight:600}
.chart figcaption p{font-size:12.5px;color:var(--muted)}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow b{font-weight:600;color:var(--fg);font-family:var(--f-data);font-size:12px}
.sw-k{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.thinbar{display:flex;gap:2px;height:10px}
.thinbar span{border-radius:999px;background:var(--c);min-width:6px}
.mk{outline-offset:2px}
.mk:hover,.mk:focus-visible{filter:brightness(1.1) saturate(1.05)}
.colplot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:190px;border-bottom:1px solid var(--line)}
.colslot{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;padding-top:4px}
.colval{font:500 13px/1 var(--f-data);color:var(--fg)}
.colbar{width:24px;border-radius:4px 4px 0 0;background:var(--lv);min-height:0}
.collabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
.hbars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:9px 10px;align-items:center;font-size:13px}
.hrow{display:contents}
.hl{white-space:nowrap}
.htrack{display:flex;gap:2px;height:14px}
.hseg{height:100%;background:var(--c)}
.hseg:last-child{border-radius:0 4px 4px 0}
.hv{font:500 12.5px/1 var(--f-data);color:var(--fg);text-align:right}
.chart .empty{padding:18px 0}
table.mini{min-width:0;font-size:13.5px}
table.mini td,table.mini th{padding:8px 4px}
table.mini tbody tr:hover{background:transparent}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 11px;max-width:260px;display:flex;flex-direction:column;gap:2px}
.tip strong{font:600 15px/1.2 var(--f-data)}
.tip span{font-size:12.5px;color:var(--muted)}

/* theme drawer */
.drawer{position:fixed;z-index:70;top:0;right:0;bottom:0;width:min(390px,92vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dh h2{font-size:20px;font-weight:600}
.ds{display:flex;flex-direction:column;gap:10px}
.ds h3{font:600 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.presets{display:grid;gap:8px}
.preset{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);text-align:left;color:var(--fg)}
.preset[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in oklab, var(--brand) 32%, transparent)}
.sw{display:flex;flex:none;padding-left:4px}
.sw i{width:18px;height:18px;border-radius:50%;margin-left:-5px;border:2px solid var(--surface)}
.preset .pn{display:block;font-weight:600}
.preset small{display:block;color:var(--muted);font-size:12px}
.seg.full{display:flex}
.seg.full button{flex:1}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.colorfield{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);min-width:0;cursor:pointer}
.colorfield input{width:34px;height:30px;border:0;padding:0;background:none;flex:none;cursor:pointer}
.colorfield span{font-size:13px;min-width:0;line-height:1.3}
.colorfield code{display:block;font:500 11px var(--f-data);color:var(--muted)}
.dnote{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.dnote code{font:500 12px var(--f-data);color:var(--brand-text)}

/* toast + footer */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.foot b{font-weight:600;color:var(--fg)}
/* staff chat */
.topbtn{position:relative}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--w3);color:var(--w3-ink);font:600 11px/18px var(--f-data);text-align:center;box-shadow:0 0 0 2px var(--brand)}
.wholine{font-size:13.5px;font-weight:600;color:var(--fg)}
.chatpanel{gap:12px;overflow:hidden}
.online{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.online h3{font:600 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.online ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:126px;overflow-y:auto}
.online li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.online li img{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface-2),0 0 0 3.5px var(--ok)}
.online .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.online .where{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;padding-left:8px}
.msgs{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.daysep{align-self:center;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:4px 0}
.msg{display:flex;gap:8px;align-items:flex-end;min-width:0}
.msg > img{width:28px;height:28px;border-radius:50%;flex:none}
.msg.me{flex-direction:row-reverse}
.bubble{min-width:0;max-width:82%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px 8px;display:flex;flex-direction:column;gap:3px}
.msg.me .bubble{background:var(--brand);color:var(--brand-ink);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble .who{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:12px;font-weight:600}
.bubble .who time{font-weight:400;opacity:.78;font-size:11.5px;font-family:var(--f-data)}
.bubble .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.msgdel{align-self:flex-start;border:0;background:none;color:inherit;opacity:.8;font-size:11.5px;text-decoration:underline;padding:0}
.chatnote{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-sm);padding:9px 11px}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.composer textarea.input{min-height:44px;max-height:132px;resize:none;padding:10px 12px}
.chatfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  rows.forEach(x => {
    k[x.st === 'complete' ? 'done' : x.st]++;
    k.present += x.present; k.absent += x.absent;
    if (x.s.present !== '') k.reported++;
    x.s.incidents.forEach(i => { k.lv[i.level - 1]++; const key = i.violation || 'NONE'; k.reasons[key] = (k.reasons[key] || 0) + 1; });
  });

let dlPromise = null;
function getDownloads() {
  if (dlPromise) return dlPromise;
  if (window.claude && typeof window.claude.use === 'function') {
    dlPromise = Promise.resolve(window.claude.use('downloads')).catch(() => null);
    return dlPromise;
  }
  return Promise.resolve(null);
}
const MIME = { xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv: 'text/csv;charset=utf-8', html: 'text/html;charset=utf-8' };
function browserDownload(filename, data) {
  const ext = filename.split('.').pop();
  const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Downloaded ${filename}`);
}
async function saveFile(filename, data) {
  const dl = await getDownloads();
  if (!dl) { browserDownload(filename, data); return; }
  try {
    const res = await dl.save({ filename, data });
    if (res && res.status === 'saved') toast(`Saved ${filename}`);
  } catch (err) {
    const c = err && err.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') toast('A download is already waiting for your answer.');
    else toast('This file couldn’t be saved here.');
  }
}
function records(rows) {

    Present: x.s.present === '' ? '' : x.present, Absent: x.absent, Total: x.present + x.absent,
    'Warning 1': x.s.incidents.filter(i => i.level === 1).length, 'Warning 2': x.s.incidents.filter(i => i.level === 2).length,
    'Warning 3': x.s.incidents.filter(i => i.level === 3).length, 'Cheating report': x.s.incidents.filter(i => i.level === 4).length,
    'Invigilator (1)': x.s.inv1, 'Invigilator (2)': x.s.inv2, 'Floor invigilator': x.s.floor ? floorLabel(x.s.floor) : '', Coordinator: x.s.coord,
    Observed: VIOLATIONS.filter(v => x.s.flags[v.code]).map(v => v.en).join(', '), Comments: x.s.comments, Status: STATUS_LABEL[x.st]
  }));
  const warnings = [], absentees = [];

async function renderChat(fromSnapshot) {
  const msgs = allMessages();

  const newest = msgs.length ? msgs[msgs.length - 1].at : 0;
  if (fromSnapshot === true) {
    const fresh = chat.firstSnap ? [] : others.filter(m => m.at > chat.lastAt);
    chat.firstSnap = false;
    chat.lastAt = Math.max(chat.lastAt, newest);
    if (fresh.length && !chatOpen()) {
      const last = fresh[fresh.length - 1];
      const ps = await profilesFor([last.uid]);
      toast(`${nameOf(ps, last.uid)}: ${last.t.length > 70 ? last.t.slice(0, 70) + '…' : last.t}`);
    }
  }

  const unread = others.filter(m => m.at > chatSeen).length;
  const badge = $('#chatBadge');
  badge.hidden = !unread; badge.textContent = unread > 9 ? '9+' : String(unread);
  $('#chatBtn').setAttribute('aria-label', unread ? `Staff chat, ${unread} unread` : 'Staff chat');
  if (!chatOpen()) return;

  const box = $('#chatMsgs');
  if (chat.api && chat.api.gate()) { box.replaceChildren(); return; }
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const ps = await profilesFor(msgs.map(m => m.uid));
  const frag = document.createDocumentFragment();
  if (!msgs.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = chat.loaded ? 'No messages yet. Say hello to the exam team.' : 'Loading messages…';
    frag.append(p);
  }
  let lastDay = '';
  msgs.forEach(m => {
    const day = dayLabel(m.at);
    if (day !== lastDay) { const sep = document.createElement('div'); sep.className = 'daysep'; sep.textContent = day; frag.append(sep); lastDay = day; }
    const mine = m.uid === chat.myId;
    const row = document.createElement('div'); row.className = 'msg' + (mine ? ' me' : '');
    if (!mine) { const img = document.createElement('img'); img.alt = ''; img.src = ps[m.uid] ? ps[m.uid].avatarUrl : ''; row.append(img); }
    const b = document.createElement('div'); b.className = 'bubble';
    const who = document.createElement('div'); who.className = 'who';
    const nm = document.createElement('span'); nm.textContent = mine ? 'You' : nameOf(ps, m.uid);
    const tm = document.createElement('time'); tm.dateTime = new Date(m.at).toISOString(); tm.textContent = timeLabel(m.at);
    who.append(nm, tm);

}

function writeMine(fn) {

    const next = fn(chat.mine);
    await chat.db.doc('chat/' + chat.myId).set({ msgs: next });
    chat.mine = next;
  });

}
function chatWriteFailed(err) {

  else if (c === 'quota_exceeded') toast('The chat is full. The portal owner can clear old messages.');

}
function sendChat() {
  const el = $('#chatInput');
  const text = el.value.trim();
  if (text && chat.api) {
    if (chat.api.gate()) return;
    el.value = '';
    chat.api.send(text.slice(0, 1000)).catch(() => { if (!el.value) el.value = text; toast('Message not sent. Check the connection and try again.'); });
    return;
  }
  if (!text || !chat.db) return;
  if (!chat.myId) { toast('Sign in to claude.ai to post in the chat.'); return; }
  el.value = '';
  const msg = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), t: text.slice(0, 1000), at: Date.now() };
  writeMine(list => list.concat(msg).slice(-CHAT_KEEP)).catch(err => { if (!el.value) el.value = text; chatWriteFailed(err); });
}
async function deleteMessage(uid, id) {
  if (chat.api) {
    try { await chat.api.remove(uid, id); toast('Message deleted'); } catch (err) { toast('The message couldn’t be deleted.'); }
    return;
  }
  try {
    if (uid === chat.myId) await writeMine(list => list.filter(m => m.id !== id));
    else if (chat.owner) {
      const d = chat.docs.get(uid);
      const next = (Array.isArray(d && d.msgs) ? d.msgs : []).filter(m => m.id !== id);
      await chat.db.doc('chat/' + uid).set({ msgs: next });
    }
    toast('Message deleted');
  } catch (err) { toast('The message couldn’t be deleted.'); }
}
async function clearChat() {

    try { await chat.api.clear(); toast('Chat cleared'); } catch (err) { toast('Some messages couldn’t be deleted. Try again.'); }
    return;
  }
  try {
    for (const uid of [...chat.docs.keys()]) await chat.db.doc('chat/' + uid).delete();

  };
  const writePresence = () => {
    if (!st.me || gate || st.where === st.written) return;
    st.written = st.where;
    fdb.collection('presence').doc(st.me.uid).set({
      name: (st.me.displayName || st.me.email || '').slice(0, 150), photo: (st.me.photoURL || '').slice(0, 500),
      where: st.where.slice(0, 40), lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => { st.written = null; });
  };
  chat.api = {
    gate: () => gate,
    onlineTitle: 'Active today',
    note() {
      return gate === 'setup' ? 'The chat isn’t connected yet. The portal owner can connect it by following “Set up the chat” in the README.'
        : gate === 'loading' ? 'Connecting to the chat…'
        : gate === 'signin' ? 'Sign in with your Google account to read and post messages.'
        : gate === 'denied' ? `${st.denied || 'This account'} isn’t on the chat list. Ask the portal owner to add this email, or sign in with another account.`
        : gate === 'error' ? 'The chat isn’t available right now. Check the connection and reload the page.' : '';
    },
    who: () => st.me ? (st.me.displayName || st.me.email || '') : '',
    messages: () => st.msgs,
    async profiles(ids) {
      const src = new Map();
      st.presence.forEach(p => src.set(p.uid, p));
      st.msgs.forEach(m => src.set(m.uid, { name: m.name, photo: m.photo }));
      const out = {};
      ids.forEach(id => { const p = src.get(id) || {}; out[id] = { name: p.name || '', avatarUrl: p.photo || initialsAvatar(p.name) }; });
      return out;
    },
    async online() {
      return st.online.map(p => ({ isMe: !!st.me && p.uid === st.me.uid, name: p.name, avatar: p.photo || initialsAvatar(p.name), where: p.where }));
    },
    send: text => fdb.collection('messages').add({
      uid: st.me.uid, name: (st.me.displayName || st.me.email || '').slice(0, 150), photo: (st.me.photoURL || '').slice(0, 500),
      text, at: firebase.firestore.FieldValue.serverTimestamp()
    }),
    remove: (uid, id) => fdb.collection('messages').doc(id).delete(),
    async clear() {
      const snap = await fdb.collection('messages').get();
      for (const d of snap.docs) await d.ref.delete();
    },
    setWhere(w) { st.where = w; clearTimeout(st.whereTimer); st.whereTimer = setTimeout(writePresence, 60 * 1000); },
    signIn() {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
        if (err && err.code === 'auth/unauthorized-domain') toast('This website isn’t on the chat’s list of allowed domains yet. See “Set up the chat” in the README.');
        else if (!(err && /popup-closed|cancelled-popup/.test(err.code || ''))) toast('Sign-in didn’t finish. Try again.');
      });
    },
    async signOut() {
      if (st.me && !gate) await fdb.collection('presence').doc(st.me.uid).delete().catch(() => {});
      stop(); auth.signOut();
    }
  };
  if (!cfg || !cfg.firebase || !cfg.firebase.apiKey) { renderComposer(); return; }
  gate = 'loading'; renderComposer();
  try {
    if (!window.firebase) for (const part of ['app', 'auth', 'firestore']) await loadScript(`${FIREBASE_SDK}${part}-compat.js`);
    firebase.initializeApp(cfg.firebase);
    auth = firebase.auth(); fdb = firebase.firestore();
  } catch (e) { gate = 'error'; renderComposer(); return; }
  auth.onAuthStateChanged(async user => {
    stop();
    st.me = user; st.msgs = []; st.presence = []; st.online = [];
    chat.myId = user ? user.uid : null; chat.owner = false; chat.loaded = false; chat.firstSnap = true;
    if (!user) { gate = 'signin'; renderComposer(); renderChat(); renderOnline(); return; }
    gate = 'loading'; renderComposer();
    try {
      const acc = await fdb.doc('config/access').get();
      st.admins = (acc.get('admins') || []).map(e => String(e).toLowerCase());
    } catch (e) {
      st.denied = user.email || ''; gate = 'denied'; renderComposer(); renderChat(); renderOnline(); return;
    }
    chat.owner = st.admins.includes(String(user.email || '').toLowerCase());
    gate = '';
    const since = ms => firebase.firestore.Timestamp.fromMillis(Date.now() - ms);
    st.unsub.push(fdb.collection('messages').where('at', '>=', since(HISTORY_MS)).orderBy('at', 'desc').limit(100).onSnapshot(snap => {
      st.msgs = snap.docs.map(d => {
        const at = d.get('at', { serverTimestamps: 'estimate' });
        return { uid: String(d.get('uid') || ''), id: d.id, t: String(d.get('text') || '').slice(0, 1000),
          at: at && at.toMillis ? at.toMillis() : Date.now(), name: String(d.get('name') || ''), photo: String(d.get('photo') || '') };
      }).reverse();
      chat.loaded = true;
      renderChat(true);
    }, () => { gate = 'error'; renderComposer(); }));
    st.unsub.push(fdb.collection('presence').where('lastSeen', '>', since(ACTIVE_MS)).onSnapshot(snap => {
      st.presence = snap.docs.map(d => {
        const t = d.get('lastSeen', { serverTimestamps: 'estimate' });
        return { uid: d.id, name: String(d.get('name') || ''), photo: String(d.get('photo') || ''), where: String(d.get('where') || ''), lastSeen: t && t.toMillis ? t.toMillis() : 0 };
      });
      refreshOnline();
    }, () => {}));
    st.where = whereLabel(); writePresence();
    renderComposer(); renderOnline(); renderChat();
  });
  window.addEventListener('pagehide', () => { if (st.me && !gate) fdb.collection('presence').doc(st.me.uid).delete().catch(() => {}); });
}

/* ---------- start ---------- */
syncExam();
applyTheme();
if (hasClaude) { $('#roleSelect').hidden = true; $('#roleLabel').textContent = 'Signed in'; $('#roleHint').textContent = 'Checking your access…'; }
setTimeout(getDownloads, 0);
applyRoute(decodeURIComponent((location.hash || '').slice(1)) || 'room-13');
initIdentity();
initChat();
initPresence();
initFirebaseChat();
})();
</script>
</body>
</html>
